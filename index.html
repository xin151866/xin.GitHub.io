<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meteor 的抖音主页</title>
    <style>
        /* ================= 基础设置 & 动态星空背景 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* 星空背景 */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.5), rgba(0,0,0,0)),
                radial-gradient(3px 3px at 160px 120px, #25F4EE, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: starsAnimation 60s linear infinite;
            z-index: 0;
        }

        @keyframes starsAnimation {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }

        /* 流星效果 */
        .meteor {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            transform: rotate(45deg);
            animation: meteorFall 4s linear infinite;
            opacity: 0;
            z-index: 1;
        }
        .meteor:nth-child(1) { animation-delay: 1s; top: 10%; left: 20%; }
        .meteor:nth-child(2) { animation-delay: 3s; top: 30%; left: 60%; }

        @keyframes meteorFall {
            0% { transform: translate(0, 0) rotate(45deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(300px, 300px) rotate(45deg); opacity: 0; }
        }

        /* ================= 主卡片（毛玻璃效果） ================= */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            width: 88%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: cardFadeIn 0.8s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ================= 头像区域 ================= */
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            object-fit: cover;
            position: relative;
            z-index: 2;
            transition: transform 0.3s;
        }

        .avatar-container:hover .avatar {
            transform: scale(1.05);
        }

        /* 头像光环 */
        .avatar-container::before {
            content: "";
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #25F4EE, #FE2C55, #25F4EE);
            background-size: 200% 200%;
            animation: glowRotate 3s linear infinite;
            z-index: 1;
            opacity: 0.6;
            filter: blur(5px);
        }

        @keyframes glowRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= 个人信息 ================= */
        .nickname {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .douyin-id {
            font-size: 13px;
            color: #888;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #25F4EE;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:active {
            background: rgba(37, 244, 238, 0.3);
            transform: scale(0.95);
        }

        /* 个人简介（打字机效果容器） */
        .bio {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 18px;
            line-height: 1.5;
            min-height: 40px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            background-color: #25F4EE;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ================= 标签 ================= */
        .tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .tag:hover {
            background: rgba(37, 244, 238, 0.15);
            border-color: #25F4EE;
            color: #25F4EE;
        }

        /* ================= 数据面板 ================= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #777;
        }

        /* ================= 主按钮 ================= */
        .jump-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 16px 0;
            background: linear-gradient(90deg, #25F4EE, #FE2C55);
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(254, 44, 85, 0.3);
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
        }

        .jump-btn::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s;
        }

        .jump-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(254, 44, 85, 0.5);
        }

        .jump-btn:hover::after {
            left: 100%;
        }

        .jump-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* ================= 分享 & 二维码按钮组 ================= */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 10px 0;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* ================= 底部页脚 ================= */
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #555;
            display: flex;
            justify-content: center; /* 调整为居中显示 */
            align-items: center;
            padding: 0 10px;
        }

        /* ================= Toast 轻提示 ================= */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 35, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(37, 244, 238, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ================= 二维码弹窗 ================= */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1a1a1f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-content img {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #25F4EE;
        }

        .modal-content p {
            font-size: 13px;
            color: #aaa;
        }

        .close-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 28px;
            height: 28px;
            background: #FE2C55;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #1a1a1f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 动态流星元素 -->
    <div class="meteor"></div>
    <div class="meteor"></div>

    <div class="card">
        <!-- 头像 -->
        <div class="avatar-container">
            <img class="avatar" src="https://cdn.html2.link/images/OL7WTJ1Ern_qmQM5YFgmU/iKLRISQ-K8gkpNQYUDmVb.png" alt="meteor的头像">
        </div>
        
        <!-- 昵称与账号 -->
        <div class="nickname">meteor</div>
        
        <div class="douyin-id">
            <span>抖音号：72451028875</span>
            <button class="copy-btn" onclick="copyId()">复制</button>
        </div>

        <!-- 个人简介（打字机效果） -->
        <div class="bio">
            <span id="typewriter"></span><span class="cursor"></span>
        </div>

        <!-- 个人标签 -->
        <div class="tags">
            <span class="tag">👦 男</span>
            <span class="tag">📍 河南·驻马店</span>
            <span class="tag">🎮 游戏</span>
            <span class="tag">🌙 日常</span>
        </div>

        <!-- 数据面板 -->
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-num">424</span>
                <span class="stat-label">获赞</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">190</span>
                <span class="stat-label">粉丝</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">296</span>
                <span class="stat-label">关注</span>
            </div>
            <div class="stat-item">
                <span class="stat-num">146</span>
                <span class="stat-label">互关</span>
            </div>
        </div>

        <!-- 跳转按钮 -->
        <a class="jump-btn" href="https://v.douyin.com/W0qBDM6EoRg/" target="_blank" rel="noopener noreferrer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;">
                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM16.5 12.5L13 16V13H8V11H13V8L16.5 11.5L17 12L16.5 12.5Z" fill="white"/>
            </svg>
            打开抖音主页
        </a>

        <!-- 功能按钮组 -->
        <div class="action-row">
            <button class="action-btn" onclick="sharePage()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                分享页面
            </button>
            <button class="action-btn" onclick="showQRCode()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                二维码
            </button>
        </div>

        <!-- 底部版权 -->
        <div class="footer">
            <span>Made by Meteor</span>
        </div>
    </div>

    <!-- Toast 提示组件 -->
    <div class="toast" id="toast">操作成功</div>

    <!-- 二维码弹窗 -->
    <div class="modal" id="qrModal" onclick="hideQRCode(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="close-btn" onclick="hideQRCode()">×</div>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://v.douyin.com/W0qBDM6EoRg/" alt="抖音二维码">
            <p>打开抖音扫一扫关注我</p>
        </div>
    </div>

    <script>
        // --- 1. 复制抖音号功能 (带自定义 Toast) ---
        function copyId() {
            const id = "72451028875";
            navigator.clipboard.writeText(id).then(() => {
                showToast("抖音号已复制：" + id);
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = id;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast("抖音号已复制：" + id);
            });
        }

        // --- 2. 自定义 Toast 轻提示 ---
        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // --- 3. 分享页面功能 ---
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'Meteor 的抖音主页',
                    text: '快来看看我的抖音主页吧！',
                    url: window.location.href
                }).then(() => {
                    showToast("分享成功！");
                }).catch((error) => {
                    console.log('分享取消或失败', error);
                });
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showToast("网页链接已复制，快去分享吧！");
                }).catch(() => {
                    showToast("请手动复制浏览器地址栏链接分享");
                });
            }
        }

        // --- 4. 二维码弹窗功能 ---
        function showQRCode() {
            document.getElementById('qrModal').classList.add('show');
        }

        function hideQRCode(e) {
            if (e && e.target !== e.currentTarget) return; 
            document.getElementById('qrModal').classList.remove('show');
        }

        // --- 5. 打字机效果 ---
        const textToType = "热爱生活，分享日常碎片 ✨ 感谢你的关注！";
        const typewriterElement = document.getElementById('typewriter');
        let typeIndex = 0;
        let isDeleting = false;

        function type() {
            const currentText = textToType.substring(0, typeIndex);
            typewriterElement.textContent = currentText;

            if (!isDeleting && typeIndex < textToType.length) {
                typeIndex++;
                setTimeout(type, 100);
            } else if (isDeleting && typeIndex > 0) {
                typeIndex--;
                setTimeout(type, 50);
            } else {
                if (!isDeleting) {
                    isDeleting = true;
                    setTimeout(type, 3000);
                } else {
                    isDeleting = false;
                    setTimeout(type, 500);
                }
            }
        }
        window.onload = type;
    </script>

</body>
</html>
